<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Boulangerie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, rgb(16, 216, 252) 0%, rgb(202, 231, 245) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-login {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            background: white;
            max-width: 450px;
            width: 100%;
        }
        .card-header-custom {
            background: linear-gradient(135deg, rgb(16, 172, 245), rgb(132, 180, 224));
            color: white;
            padding: 30px 30px 25px;
            text-align: center;
            border-bottom: none;
        }
        .card-header-custom h2 {
            margin: 0;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .card-header-custom .subtitle {
            font-size: 0.9rem;
            opacity: 0.85;
            margin-top: 5px;
        }
        .card-body-custom {
            padding: 40px 35px;
        }
        .form-label {
            font-weight: 600;
            color: #4a3520;
            margin-bottom: 8px;
        }
        .form-control {
            border-radius: 12px;
            border: 2px solid #e9d5c0;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: rgb(14, 199, 245);
            box-shadow: 0 0 0 4px rgba(160, 82, 45, 0.15);
        }
        .btn-login {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            border: none;
            padding: 14px;
            font-weight: 700;
            border-radius: 50px;
            transition: all 0.3s ease;
            color: white;
            font-size: 1.1rem;
            width: 100%;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 69, 19, 0.35);
            color: white;
        }
        .logo-icon {
            font-size: 4rem;
            color: #f5e6ca;
        }
        .alert-custom {
            border-radius: 12px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="card card-login">
        <div class="card-header-custom">
            <i class="bi bi-cup-hot logo-icon"></i>
            <h2>Boulangerie Tina</h2>
            <div class="subtitle">Gestion des fiches de stocks</div>
        </div>
        <div class="card-body-custom">
            
            <!-- Affichage des erreurs -->
            {% if form.errors %}
                <div class="alert alert-danger alert-custom" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    Nom d'utilisateur ou mot de passe incorrect.
                </div>
            {% endif %}

            <!-- Affichage des messages de déconnexion -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-custom" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label for="id_username" class="form-label">
                        <i class="bi bi-person"></i> Nom d'utilisateur
                    </label>
                    <input type="text" name="username" id="id_username" class="form-control" placeholder="Entrez votre nom d'utilisateur" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label">
                        <i class="bi bi-lock"></i> Mot de passe
                    </label>
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Entrez votre mot de passe" required>
                </div>

                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Se connecter
                </button>
            </form>

            <div class="mt-4 text-center text-muted small">
                <i class="bi bi-info-circle"></i> Contactez l'administrateur pour obtenir vos identifiants.
            </div>
        </div>
    </div>
</body>
</html>
