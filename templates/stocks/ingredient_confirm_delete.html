<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supprimer - Boulangerie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fdf6e3 0%, #f5e6ca 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-confirm {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            background: white;
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }
        .icon-danger {
            font-size: 4rem;
            color: #dc3545;
        }
        .btn-danger-custom {
            background: #dc3545;
            border: none;
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-danger-custom:hover {
            background: #b02a37;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.35);
        }
    </style>
</head>
<body>
    <div class="card card-confirm">
        <div class="icon-danger mb-3">
            <i class="bi bi-trash3-fill"></i>
        </div>
        <h3 class="mb-3">Confirmer la suppression</h3>
        <p class="text-muted mb-4">
            Êtes-vous sûr de vouloir supprimer l'ingrédient <strong>"{{ ingredient.nom }}"</strong> ?<br>
            Cette action est irréversible.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Annuler
            </a>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger-custom">
                    <i class="bi bi-check2-circle"></i> Oui, supprimer
                </button>
            </form>
        </div>
    </div>
</body>
</html>
