<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titre }} - Épicerie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: linear-gradient(135deg, #fdf6e3 0%, #f5e6ca 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-form { border: none; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.12); background: white; max-width: 550px; width: 100%; }
        .card-header-custom { background: linear-gradient(135deg, #2b7d4b, #1e5f38); color: white; padding: 25px 30px; }
        .card-body-custom { padding: 35px; }
    </style>
</head>
<body>
    <div class="card card-form">
        <div class="card-header-custom">
            <h2><i class="bi bi-{{ icone }} me-2"></i>{{ titre }}</h2>
        </div>
        <div class="card-body-custom">
            <nav><a href="{% url 'historique_boulangerie' %}" class="text-muted"><i class="bi bi-arrow-left"></i> Retour</a></nav>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex justify-content-end gap-3 mt-4">
                    <a href="{% url 'historique_boulangerie' %}" class="btn btn-secondary">Annuler</a>
                    <button type="submit" class="btn btn-success">{{ bouton }}</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
