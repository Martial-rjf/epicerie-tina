<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email envoyé - Boulangerie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: linear-gradient(135deg, #fdf6e3 0%, #f5e6ca 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border: none; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.12); background: white; padding: 40px; max-width: 450px; width: 100%; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <i class="bi bi-envelope-check" style="font-size: 4rem; color: #2b7d4b;"></i>
        <h3 class="mt-3">Email envoyé !</h3>
        <p class="text-muted">Un lien de réinitialisation vous a été envoyé par email. Vérifiez votre boîte de réception.</p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-3" style="border-radius: 50px; background: #6b3a1f; border: none;">Retour à la connexion</a>
    </div>
</body>
</html>
