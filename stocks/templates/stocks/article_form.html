<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titre }} - Épicerie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fdf6e3 0%, #f5e6ca 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-form {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            overflow: hidden;
            background: white;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #2b7d4b, #1e5f38);
            color: white;
            padding: 25px 30px;
            border-bottom: none;
        }
        .card-header-custom h2 {
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .card-body-custom {
            padding: 40px 35px;
        }
        .form-label {
            font-weight: 600;
            color: #4a3520;
            margin-bottom: 8px;
        }
        .form-control {
            border-radius: 12px;
            border: 2px solid #e9d5c0;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #2b7d4b;
            box-shadow: 0 0 0 4px rgba(43,125,75,0.15);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #2b7d4b, #1e5f38);
            border: none;
            padding: 14px 35px;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
            color: white;
            font-size: 1.1rem;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(43,125,75,0.35);
            color: white;
        }
        .btn-secondary-custom {
            background: #f0e6d8;
            border: none;
            padding: 14px 35px;
            font-weight: 600;
            border-radius: 50px;
            color: #4a3520;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            text-decoration: none;
            display: inline-block;
        }
        .btn-secondary-custom:hover {
            background: #e0d0bc;
            transform: translateY(-2px);
        }
        .form-icon {
            font-size: 2rem;
            color: #f5e6ca;
        }
        .breadcrumb-custom {
            background: transparent;
            padding: 0;
            margin-bottom: 20px;
        }
        .breadcrumb-custom a {
            color: #2b7d4b;
            text-decoration: none;
            font-weight: 500;
        }
        .breadcrumb-custom a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card card-form">
                    <div class="card-header-custom">
                        <div class="d-flex align-items-center gap-3">
                            <i class="bi bi-cup-hot form-icon"></i>
                            <h2><i class="bi bi-{{ icone }} me-2"></i>{{ titre }}</h2>
                        </div>
                    </div>
                    <div class="card-body-custom">
                        <nav class="breadcrumb-custom">
                            <a href="{% url 'liste_articles' %}"><i class="bi bi-arrow-left"></i> Retour à la liste des articles</a>
                        </nav>

                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-tag"></i> {{ form.nom.label }}</label>
                                {{ form.nom }}
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-currency-euro"></i> {{ form.prix_vente.label }}</label>
                                {{ form.prix_vente }}
                            </div>
                            <div class="d-flex justify-content-end gap-3 mt-4">
                                <a href="{% url 'liste_articles' %}" class="btn btn-secondary-custom"><i class="bi bi-x-circle"></i> Annuler</a>
                                <button type="submit" class="btn btn-primary-custom"><i class="bi bi-check2-circle"></i> {{ bouton }}</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
