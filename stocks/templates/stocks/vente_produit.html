<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vente - Boulangerie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: linear-gradient(135deg, #fdf6e3 0%, #f5e6ca 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-vente { border: none; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.12); max-width: 550px; width: 100%; background: white; }
        .card-header-custom { background: linear-gradient(135deg, #8B4513, #A0522D); color: white; padding: 25px 30px; border-bottom: none; border-radius: 20px 20px 0 0; }
        .card-body-custom { padding: 35px; }
        .btn-vente { background: linear-gradient(135deg, #2b7d4b, #1e5f38); border: none; padding: 14px; border-radius: 50px; font-weight: 700; color: white; width: 100%; }
        .btn-vente:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(43,125,75,0.35); color: white; }
    </style>
</head>
<body>
    <div class="card card-vente">
        <div class="card-header-custom text-center">
            <h3><i class="bi bi-cart-plus me-2"></i>Vente</h3>
        </div>
        <div class="card-body-custom">
            <div class="text-center mb-4">
                <h4>{{ produit.nom }}</h4>
                <p class="text-muted">Prix : {{ produit.prix_vente }} Ar</p>
            </div>

            <!-- Affichage des erreurs -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <!-- ✅ CSRF TOKEN AJOUTÉ -->
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="quantite" class="form-label">Quantité à vendre</label>
                    <input type="number" name="quantite" id="quantite" class="form-control" min="1" step="1" required placeholder="Ex: 5">
                </div>
                <button type="submit" class="btn-vente"><i class="bi bi-check2-circle"></i> Valider la vente</button>
            </form>

            <div class="mt-3 text-center">
                <a href="{% url 'liste_produits' %}" class="btn btn-secondary">Annuler</a>
            </div>
        </div>
    </div>
</body>
</html>
