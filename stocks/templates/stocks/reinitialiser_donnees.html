<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser - Boulangerie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirmation de réinitialisation</h4>
                    </div>
                    <div class="card-body text-center">
                        <i class="bi bi-trash" style="font-size: 4rem; color: #dc3545;"></i>
                        <h4 class="mt-3">⚠️ Attention ! Cette action est irréversible.</h4>
                        <p class="text-muted">Toutes les données seront supprimées définitivement.</p>
                        <p><strong>Pour confirmer, tapez "OUI" ci-dessous :</strong></p>
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <input type="text" name="confirmation" class="form-control text-center" placeholder="Tapez OUI" required>
                            </div>
                            <div class="d-flex gap-2 justify-content-center">
                                <a href="{% url 'restaurer_donnees' %}" class="btn btn-secondary">Annuler</a>
                                <button type="submit" class="btn btn-danger">Confirmer la réinitialisation</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
