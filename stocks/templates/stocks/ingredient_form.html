<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titre }} - Boulangerie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: linear-gradient(135deg, #fdf6e3 0%, #f5e6ca 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-form { border: none; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.12); overflow: hidden; background: white; }
        .card-header-custom { background: linear-gradient(135deg, #8B4513, #A0522D); color: white; padding: 25px 30px; }
        .card-body-custom { padding: 40px 35px; }
        .form-control { border-radius: 12px; border: 2px solid #e9d5c0; padding: 12px 16px; }
        .form-control:focus { border-color: #A0522D; box-shadow: 0 0 0 4px rgba(160,82,45,0.15); }
        .btn-primary-custom { background: linear-gradient(135deg, #8B4513, #A0522D); border: none; padding: 14px 35px; border-radius: 50px; color: white; }
        .btn-primary-custom:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139,69,19,0.35); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card card-form">
                    <div class="card-header-custom">
                        <h2><i class="bi bi-{{ icone }} me-2"></i>{{ titre }}</h2>
                    </div>
                    <div class="card-body-custom">
                        <nav>
                            <a href="{% url 'gestion_ingredients' %}"><i class="bi bi-arrow-left"></i> Retour</a>
                        </nav>
                        <form method="POST">
                            {% csrf_token %}  <!-- ✅ LIGNE AJOUTÉE -->
                            {{ form.as_p }}
                            <div class="d-flex justify-content-end gap-3 mt-4">
                                <a href="{% url 'gestion_ingredients' %}" class="btn btn-secondary">Annuler</a>
                                <button type="submit" class="btn-primary-custom">{{ bouton }}</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
