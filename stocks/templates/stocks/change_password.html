<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer le mot de passe - Boulangerie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: linear-gradient(135deg, #fdf6e3 0%, #f5e6ca 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border: none; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.12); background: white; padding: 40px; max-width: 450px; width: 100%; }
        .btn-change { background: linear-gradient(135deg, #6b3a1f, #8B5A2B); border: none; padding: 12px; border-radius: 50px; font-weight: 600; color: white; width: 100%; }
        .btn-change:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(107,58,31,0.35); color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h3 class="text-center mb-3"><i class="bi bi-key"></i> Changer le mot de passe</h3>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-change">Changer le mot de passe</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'accueil' %}">Retour au tableau de bord</a>
        </div>
    </div>
</body>
</html>
