<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titre }} - Boulangerie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fdf6e3 0%, #f5e6ca 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-form {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            background: white;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            color: white;
            padding: 25px 30px;
            border-bottom: none;
        }
        .card-header-custom h2 {
            margin: 0;
            font-weight: 600;
        }
        .card-body-custom {
            padding: 40px 35px;
        }
        .form-label {
            font-weight: 600;
            color: #4a3520;
        }
        .form-control, .form-select {
            border-radius: 12px;
            border: 2px solid #e9d5c0;
            padding: 12px 16px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #A0522D;
            box-shadow: 0 0 0 4px rgba(160, 82, 45, 0.15);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #dc3545, #c0392b);
            border: none;
            padding: 14px 35px;
            font-weight: 600;
            border-radius: 50px;
            color: white;
            font-size: 1.1rem;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.35);
            color: white;
        }
        .btn-secondary-custom {
            background: #f0e6d8;
            border: none;
            padding: 14px 35px;
            font-weight: 600;
            border-radius: 50px;
            color: #4a3520;
            text-decoration: none;
            display: inline-block;
        }
        .btn-secondary-custom:hover {
            background: #e0d0bc;
        }
        .form-icon {
            font-size: 2rem;
            color: #f5e6ca;
        }
        .breadcrumb-custom a {
            color: #8B4513;
            text-decoration: none;
        }
        .breadcrumb-custom a:hover {
            text-decoration: underline;
        }
        .warning-box {
            background: #fce9e9;
            padding: 15px 20px;
            border-radius: 12px;
            border-left: 4px solid #dc3545;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card card-form">
                    <div class="card-header-custom">
                        <div class="d-flex align-items-center gap-3">
                            <i class="bi bi-{{ icone }} form-icon"></i>
                            <h2><i class="bi bi-{{ icone }} me-2"></i>{{ titre }}</h2>
                        </div>
                    </div>
                    <div class="card-body-custom">
                        <nav class="breadcrumb-custom">
                            <a href="{% url 'liste_pertes' %}"><i class="bi bi-arrow-left"></i> Retour aux pertes</a>
                        </nav>

                        <div class="warning-box">
                            <i class="bi bi-exclamation-triangle-fill me-2" style="color: #dc3545;"></i>
                            <strong>Attention :</strong> Cette action est irréversible. Le stock de l'ingrédient sera diminué.
                        </div>

                        <form method="POST">
                            {% csrf_token %}
                            
                            <div class="mb-4">
                                <label for="{{ form.ingredient.id_for_label }}" class="form-label">
                                    <i class="bi bi-box-seam"></i> {{ form.ingredient.label }}
                                </label>
                                {{ form.ingredient }}
                            </div>

                            <div class="mb-4">
                                <label for="{{ form.quantite.id_for_label }}" class="form-label">
                                    <i class="bi bi-dash-circle"></i> {{ form.quantite.label }}
                                </label>
                                {{ form.quantite }}
                                <small class="text-muted d-block mt-1">Entrez la quantité perdue (positive)</small>
                            </div>

                            <div class="mb-4">
                                <label for="{{ form.commentaire.id_for_label }}" class="form-label">
                                    <i class="bi bi-chat"></i> {{ form.commentaire.label }}
                                </label>
                                {{ form.commentaire }}
                                <small class="text-muted d-block mt-1">Ex: Péremption, casse, invendu, etc.</small>
                            </div>

                            <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                                <a href="{% url 'liste_pertes' %}" class="btn-secondary-custom">
                                    <i class="bi bi-x-circle"></i> Annuler
                                </a>
                                <button type="submit" class="btn-primary-custom">
                                    <i class="bi bi-check2-circle"></i> {{ bouton }}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
