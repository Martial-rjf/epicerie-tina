<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supprimer commande</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card text-center">
            <div class="card-body">
                <h3 class="text-danger"><i class="bi bi-exclamation-triangle"></i> Confirmer la suppression</h3>
                <p>Voulez-vous vraiment supprimer la commande #{{ commande.id }} ?</p>
                <form method="POST">
                    {% csrf_token %}
                    <a href="{% url 'detail_commande' commande.id %}" class="btn btn-secondary">Annuler</a>
                    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
