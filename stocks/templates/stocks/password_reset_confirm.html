<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe - Boulangerie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: linear-gradient(135deg, #fdf6e3 0%, #f5e6ca 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border: none; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.12); background: white; padding: 40px; max-width: 450px; width: 100%; }
        .btn-reset { background: linear-gradient(135deg, #6b3a1f, #8B5A2B); border: none; padding: 12px; border-radius: 50px; font-weight: 600; color: white; width: 100%; }
    </style>
</head>
<body>
    <div class="card">
        <h3 class="text-center mb-3"><i class="bi bi-pencil"></i> Nouveau mot de passe</h3>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-reset">Changer le mot de passe</button>
        </form>
        {% if form.errors %}
            <div class="alert alert-danger mt-3">{{ form.errors }}</div>
        {% endif %}
    </div>
</body>
</html>
